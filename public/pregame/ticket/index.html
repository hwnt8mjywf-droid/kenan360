<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Ticket · Kenan's Birthday Pregame</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FF5F0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pregame Ticket">
<link rel="icon" href="/pregame/logo.webp">
<link rel="apple-touch-icon" href="/pregame/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--bg2:#FFF6F0;--line:#F1E4DB;--line2:#E3CFC2;--ink:#16110E;--body:#5B4E47;--mute:#857770;--or:#FF5F0F;--or2:#E04E04;--orsoft:#FFE9DC;--green:#1C7A43}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg2)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#fff 0%,var(--bg2) 100%);color:var(--body);font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto;padding:16px 20px 6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{width:36px;height:auto}
.brand span{font:800 15px 'Montserrat',sans-serif;letter-spacing:.06em;color:var(--ink)}
.brand span i{font-style:normal;font-weight:500}
.top a.back{font:700 13px 'Montserrat',sans-serif;color:var(--mute);text-decoration:none}
main{max-width:480px;margin:0 auto;padding:12px 20px 48px}

/* ticket */
.tk{background:#fff;border-radius:24px;box-shadow:0 34px 70px -30px rgba(70,28,5,.42),0 0 0 1px var(--line);overflow:hidden;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tk-head{position:relative;background:var(--or);color:#fff;padding:22px 24px 24px;overflow:hidden}
.tk-head:after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent 70%)}
.tk-head .row{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
.tk-head small{font:800 11px 'Montserrat',sans-serif;letter-spacing:.28em;opacity:.92}
.tk-head .free{background:#fff;color:var(--or);font:900 italic 13px 'Montserrat',sans-serif;letter-spacing:.06em;padding:5px 10px;border-radius:8px}
.tk-head h1{font:900 italic clamp(30px,8.6vw,40px)/1 'Montserrat',sans-serif;text-transform:uppercase;margin:14px 0 4px;position:relative}
.tk-head p{margin:0;font:700 12px 'Montserrat',sans-serif;letter-spacing:.4em;text-transform:uppercase;position:relative}
.tk-body{padding:22px 24px 8px}
.who small,.grid small{display:block;font:800 10.5px 'Montserrat',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.who{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:18px}
.who b{display:block;font:800 22px/1.15 'Montserrat',sans-serif;color:var(--ink)}
.who .party{text-align:right}
.who .party b{color:var(--or)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;padding:16px 0 4px;border-top:1px solid var(--line)}
.grid b{display:block;font:800 15px/1.25 'Montserrat',sans-serif;color:var(--ink)}
.grid span{display:block;font-size:13px;color:var(--mute)}
.perf{position:relative;height:28px;margin:10px 0 0}
.perf:before{content:"";position:absolute;left:22px;right:22px;top:50%;border-top:2px dashed var(--line2)}
.perf i{position:absolute;top:0;width:28px;height:28px;border-radius:50%;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--line)}
.perf i:first-child{left:-14px}.perf i:last-child{right:-14px}
.tk-qr{padding:8px 24px 24px;text-align:center}
.qr{width:min(240px,70vw);margin:0 auto;background:#fff;border-radius:14px;padding:4px}
.qr svg{display:block;width:100%;height:auto}
.code{font:800 15px 'Montserrat',sans-serif;letter-spacing:.24em;color:var(--ink);margin:12px 0 10px}
.status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font:800 13px 'Montserrat',sans-serif;letter-spacing:.04em}
.status svg{width:16px;height:16px}
.st-going{background:#E6F6EC;color:var(--green)}
.st-in{background:var(--ink);color:#fff}
.st-cancel{background:#F3EDEA;color:var(--mute)}
.hint{font-size:13px;color:var(--mute);margin:10px 0 0}

/* actions */
.acts{display:grid;gap:10px;margin:22px 0 0}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:14px;border:0;font:800 15px 'Montserrat',sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,background .2s,box-shadow .2s,border-color .2s;width:100%}
.btn:active{transform:translateY(1px)}
.btn svg{width:22px;height:22px;flex:0 0 22px}
.btn-wallet{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Manrope',sans-serif;font-weight:600;font-size:16px;letter-spacing:0}
.btn-wallet:hover{background:#222}
.btn-or{background:var(--or);color:#fff;box-shadow:0 12px 28px -14px rgba(255,95,15,.8)}
.btn-or:hover{background:var(--or2)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--line2)}
.btn-line:hover{border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--body);margin-top:14px}
.note b{color:var(--ink)}

/* door / admin */
.door{margin-top:22px;background:#fff;border:2px solid var(--or);border-radius:18px;padding:18px}
.door h2{font:900 italic 18px 'Montserrat',sans-serif;text-transform:uppercase;color:var(--ink);margin:0 0 4px}
.door p{margin:0 0 12px;font-size:14px}
.door .undo{background:none;border:0;color:var(--mute);font:700 13px 'Montserrat',sans-serif;cursor:pointer;margin-top:8px;padding:6px}

.msg{text-align:center;padding:60px 10px}
.msg h1{font:900 italic 28px 'Montserrat',sans-serif;text-transform:uppercase;color:var(--ink);margin:0 0 8px}
.msg p{margin:0 0 20px}
.skel{height:560px;border-radius:24px;background:linear-gradient(90deg,#fff 25%,#FFF1E8 50%,#fff 75%);background-size:200% 100%;animation:sh 1.2s infinite;box-shadow:0 0 0 1px var(--line)}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:360px){.tk-body,.tk-qr{padding-left:18px;padding-right:18px}.two{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tick" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="wallet" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="15" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 9.5h19" stroke="#FF5F0F" stroke-width="2.4"/><path d="M2.5 12.5h19" stroke="#F5B400" stroke-width="2.4"/><path d="M2.5 15.5h19" stroke="#22A35A" stroke-width="2.4"/><path d="M15.5 15.5h6v1.3a3.2 3.2 0 0 1-3.2 3.2H5.7a3.2 3.2 0 0 1-3.2-3.2v-1.3h6.5a3.5 3.5 0 0 0 6.5 0z" fill="currentColor"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></symbol>
  <symbol id="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></symbol>
  <symbol id="door" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
</svg>

<div class="top">
  <a class="brand" href="/pregame/"><img src="/pregame/logo.webp" alt=""><span>KENAN<i>360</i></span></a>
  <a class="back" href="/pregame/#guests">Guest list →</a>
</div>

<main id="app"><div class="skel" aria-label="Loading your ticket"></div></main>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var app=$('app');
  var t=new URLSearchParams(location.search).get('t')||'';
  var key='';try{key=sessionStorage.getItem('k360crm')||localStorage.getItem('k360crm')||'';}catch(e){}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function qrSvg(rows){
    var n=rows.length,q=2,s=n+q*2,d='';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(rows[r][c]==='1')d+='M'+(c+q)+' '+(r+q)+'h1v1h-1z';
    return '<svg viewBox="0 0 '+s+' '+s+'" shape-rendering="crispEdges" role="img" aria-label="Ticket QR code"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#16110E"/></svg>';
  }
  function time(iso){return new Date(iso).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Denver'});}

  function statusHTML(k){
    if(k.status==='Checked in')return '<span class="status st-in"><svg><use href="#tick"/></svg>Checked in'+(k.checked_in_at?' · '+esc(time(k.checked_in_at)):'')+'</span>';
    if(k.status==='Cancelled')return '<span class="status st-cancel">RSVP cancelled</span>';
    return '<span class="status st-going"><svg><use href="#tick"/></svg>You\'re on the list</span>';
  }

  function render(k){
    var ended=Date.now()>Date.parse(k.event.ends);
    app.innerHTML=
      '<article class="tk">'+
        '<div class="tk-head"><div class="row"><small>KENAN360 · BIRTHDAY</small><span class="free">FREE ENTRY</span></div>'+
          '<h1>The Ultimate Pregame</h1><p>Kenan\'s Birthday Celebration</p></div>'+
        '<div class="tk-body">'+
          '<div class="who"><div><small>Guest</small><b>'+esc(k.name)+'</b></div>'+
            '<div class="party"><small>Party</small><b>'+(k.guests?'You +'+k.guests:'Just you')+'</b></div></div>'+
          '<div class="grid">'+
            '<div><small>Date</small><b>Fri, Nov 6</b><span>2026</span></div>'+
            '<div><small>Time</small><b>9 PM – 1 AM</b><span>Doors at 9</span></div>'+
            '<div><small>Venue</small><b>Sundays Best</b><span>505 S Gale St · SLC</span></div>'+
            '<div><small>Entry</small><b>No cover</b><span>21+ · Bring ID</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="perf"><i></i><i></i></div>'+
        '<div class="tk-qr"><div class="qr">'+qrSvg(k.qr)+'</div>'+
          '<div class="code">'+esc(k.code)+'</div>'+statusHTML(k)+
          '<p class="hint">Show this QR code at the door.</p></div>'+
      '</article>'+
      (k.status==='Cancelled'||ended?'':
      '<div class="acts">'+
        (k.wallet?'<a class="btn btn-wallet" href="/api/pass?t='+encodeURIComponent(t)+'"><svg><use href="#wallet"/></svg>Add to Apple Wallet</a>':'')+
        '<div class="two">'+
          '<a class="btn btn-line" id="cal" href="#" download="kenans-pregame.ics"><svg><use href="#cal"/></svg>Calendar</a>'+
          '<a class="btn btn-line" href="https://www.google.com/maps/search/?api=1&query=Sundays+Best+505+S+Gale+St+Salt+Lake+City+UT+84101" target="_blank" rel="noopener"><svg><use href="#pin"/></svg>Directions</a>'+
        '</div>'+
        '<button class="btn btn-or" id="share" type="button"><svg><use href="#share"/></svg>Invite friends to RSVP</button>'+
      '</div>'+
      (k.wallet?'':'<div class="note"><b>Save your ticket:</b> bookmark this page or take a screenshot of the QR code. You can always find it again on the RSVP page from this phone.</div>'))+
      (k.admin?
      '<section class="door"><h2>Door check-in</h2><p>'+(k.status==='Checked in'?'Already checked in at '+esc(time(k.checked_in_at))+'.':'Let '+esc(k.name.split(' ')[0])+' in'+(k.guests?' with '+k.guests+' guest'+(k.guests>1?'s':''):'')+'?')+'</p>'+
        (k.status==='Checked in'?'<button class="undo" id="undo" type="button">Undo check-in</button>':
          '<button class="btn btn-or" id="checkin" type="button"><svg><use href="#door"/></svg>Check in'+(k.guests?' party of '+(1+k.guests):'')+'</button>')+
      '</section>':'');
    wire(k);
  }

  function wire(k){
    var cal=$('cal');
    if(cal){
      var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kenan 360//Pregame//EN','BEGIN:VEVENT','UID:kenan-bday-2026@kenan360.net',
        'DTSTAMP:20261105T000000Z','DTSTART:20261107T040000Z','DTEND:20261107T080000Z',"SUMMARY:Kenan's Birthday Pregame",
        'LOCATION:Sundays Best Rooftop\\, 505 S Gale St\\, Salt Lake City\\, UT 84101','DESCRIPTION:Your ticket: '+location.href,'END:VEVENT','END:VCALENDAR'].join('\r\n');
      cal.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
    }
    var sh=$('share');
    if(sh)sh.addEventListener('click',function(){
      var data={title:"Kenan's Birthday Pregame",text:"Kenan's birthday pregame Fri Nov 6 at Sundays Best Rooftop. Free entry, RSVP here:",url:location.origin+'/pregame'};
      if(navigator.share)navigator.share(data).catch(function(){});else location.href='sms:?&body='+encodeURIComponent(data.text+' '+data.url);
    });
    var ci=$('checkin'),un=$('undo');
    function act(a,btn){btn.disabled=true;btn.style.opacity='.6';
      fetch('/api/rsvp',{method:'POST',headers:{'content-type':'application/json','x-crm-key':key},body:JSON.stringify({t:t,action:a})})
        .then(function(r){if(!r.ok)throw 0;return r.json();}).then(render)
        .catch(function(){btn.disabled=false;btn.style.opacity='';alert('Could not update. Check the connection and try again.');});}
    if(ci)ci.addEventListener('click',function(){act('checkin',ci);});
    if(un)un.addEventListener('click',function(){if(confirm('Undo check-in?'))act('undo',un);});
  }

  function fail(title,msg){app.innerHTML='<div class="msg"><h1>'+title+'</h1><p>'+msg+'</p><a class="btn btn-or" href="/pregame/#rsvp" style="max-width:280px;margin:0 auto">RSVP Free</a></div>';}

  if(!t){fail('No ticket here','This link is missing its ticket code. RSVP to get your ticket.');return;}
  fetch('/api/rsvp?t='+encodeURIComponent(t),{headers:key?{'x-crm-key':key}:{},cache:'no-store'})
    .then(function(r){if(r.status===404)throw 'nf';if(!r.ok)throw 0;return r.json();})
    .then(function(k){
      render(k);
      // remember this ticket on this phone (not for the door staff's device)
      if(!k.admin){try{localStorage.setItem('k360ticket',t);}catch(e){}}
    })
    .catch(function(e){e==='nf'?fail('Ticket not found','We couldn\'t find this ticket. It may have been removed. RSVP again to get a new one.'):fail('Couldn\'t load','Check your connection and refresh the page.');});
})();
</script>
</body>
</html>
